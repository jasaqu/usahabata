<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota Bata Bolong</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b2118;--mu:#7a6a5c;--ac:#b5481f;--ac2:#fbe9e1;--bd:#e7ddd2;--ok:#1f7a45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--card:#251e18;--tx:#f3ebe3;--mu:#a8998b;--ac:#e8754a;--ac2:#3a2519;--bd:#3a3028;--ok:#5fcf8c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1511;--card:#251e18;--tx:#f3ebe3;--mu:#a8998b;--ac:#e8754a;--ac2:#3a2519;--bd:#3a3028;--ok:#5fcf8c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.c h2{font-size:19px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx);margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.r{display:flex;gap:8px;margin-bottom:8px}
.r>div{flex:1;min-width:0}
.it{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.it .sb{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:600}
.x{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 6px;cursor:pointer}
.add{width:100%;background:var(--ac2);color:var(--ac);border:1px dashed var(--ac);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.t{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}
.t.b{border-top:1px solid var(--bd);margin-top:4px;padding-top:10px;font-weight:700}
.big{background:var(--ac);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.big small{opacity:.85;display:block;font-size:13px}
.big b{font-size:30px;display:block;margin-top:2px}
.btn{display:flex;gap:8px}
.btn button{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.btn .p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mu{color:var(--mu)}
.btn .wa{background:#1fa855;color:#fff;border-color:#1fa855}
.btn .bt{background:#1d5fd1;color:#fff;border-color:#1d5fd1}
#st{font-size:13px;color:var(--mu);margin-top:8px;min-height:18px}
#pv{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
#pv.on{display:block}
#pv .bx{max-width:560px;margin:0 auto}
#pv img{width:100%;display:block;border-radius:10px;background:#fff}
#pv .btn{margin-top:10px}
#pvm{color:#fff;font-size:13px;margin-top:10px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="w">
<h1>🧱 Nota Bata Bolong</h1>
<div class="sub">Isi data, total otomatis terhitung.</div>

<div class="c">
<div class="r">
<div><label>Nama pembeli</label><input id="nama" placeholder="Nama / proyek"></div>
<div><label>Tanggal</label><input id="tgl" type="date"></div>
</div>
</div>

<div class="c">
<h2>Orderan</h2>
<div id="items"></div>
<button class="add noprint" onclick="addItem()">+ Tambah item</button>
</div>

<div class="c">
<h2>Biaya lain</h2>
<div class="r">
<div><label>Ongkos mobil (Rp)</label><input id="mobil" inputmode="numeric" placeholder="0"></div>
<div><label>Kuli bongkar (Rp)</label><input id="kuli" inputmode="numeric" placeholder="0"></div>
</div>
<div class="t b"><span>Total Bayar</span><span id="totalBayar">Rp 0</span></div>
</div>

<div class="c">
<h2>Talangan</h2>
<div id="tal"></div>
<button class="add noprint" onclick="addTal()">+ Tambah talangan</button>
<div class="t b"><span>Total Talangan</span><span id="totalTal">Rp 0</span></div>
</div>

<div class="big">
<small>Total yang harus dibayar (Total Bayar − Talangan)</small>
<b id="sisa">Rp 0</b>
</div>

<div class="btn noprint" style="margin-bottom:8px"><button class="p" onclick="pvBuka()">👁 Preview nota</button></div>
<div class="btn noprint">
<button class="wa" onclick="kirimWA()">Share WhatsApp (JPG)</button>
<button class="bt" onclick="cetakBT()" id="bb">Cetak Bluetooth</button>
</div>
<div id="st" class="noprint"></div>
<div class="btn noprint" style="margin-top:8px"><button onclick="reset()">Nota baru</button></div>
</div>

<div id="pv" class="noprint"><div class="bx"><img id="pvimg" alt="Preview nota"><div class="btn"><button class="wa" onclick="kirimWA()">Share WhatsApp</button><button onclick="pvTutup()">Tutup</button></div><div id="pvm"></div></div></div>

<script>
var S={nama:"",tgl:"",items:[{ket:"Bata bolong",qty:"",harga:""}],mobil:"",kuli:"",tal:[]};
var KEY="notaBata";
function n(v){v=parseFloat(String(v).replace(/[^\d.]/g,""));return isNaN(v)?0:v}
function rp(v){return "Rp "+Math.round(v).toLocaleString("id-ID")}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}
 if(!S.tgl)S.tgl=new Date().toISOString().slice(0,10)}
function draw(){
 $("nama").value=S.nama;$("tgl").value=S.tgl;$("mobil").value=S.mobil;$("kuli").value=S.kuli;
 $("items").innerHTML=S.items.map(function(it,i){return '<div class="it"><div class="r"><div><label>Barang</label><input value="'+esc(it.ket)+'" oninput="S.items['+i+'].ket=this.value;calc()"></div></div>'+
 '<div class="r"><div><label>Jumlah</label><input inputmode="numeric" placeholder="0" value="'+esc(it.qty)+'" oninput="S.items['+i+'].qty=this.value;calc()"></div>'+
 '<div><label>Harga beli (Rp)</label><input inputmode="numeric" placeholder="0" value="'+esc(it.harga)+'" oninput="S.items['+i+'].harga=this.value;calc()"></div></div>'+
 '<div class="sb"><span class="mu" id="q'+i+'"></span><span><span id="s'+i+'"></span> <button class="x noprint" onclick="delItem('+i+')">Hapus</button></span></div></div>'}).join("");
 $("tal").innerHTML=S.tal.map(function(t,i){return '<div class="r"><div style="flex:1.2"><input placeholder="Keterangan" value="'+esc(t.ket)+'" oninput="S.tal['+i+'].ket=this.value;calc()"></div>'+
 '<div><input inputmode="numeric" placeholder="Rp 0" value="'+esc(t.nom)+'" oninput="S.tal['+i+'].nom=this.value;calc()"></div>'+
 '<button class="x noprint" onclick="delTal('+i+')">✕</button></div>'}).join("");
 calc();
}
function calc(){
 var sub=0;
 S.items.forEach(function(it,i){var s=n(it.qty)*n(it.harga);sub+=s;
  var q=$("q"+i),e=$("s"+i);if(q)q.textContent=n(it.qty).toLocaleString("id-ID")+" × "+rp(n(it.harga));if(e)e.textContent=rp(s)});
 var tb=sub+n(S.mobil)+n(S.kuli);
 var tt=S.tal.reduce(function(a,t){return a+n(t.nom)},0);
 $("totalBayar").textContent=rp(tb);$("totalTal").textContent=rp(tt);$("sisa").textContent=rp(tb-tt);
 S._sub=sub;S._tb=tb;S._tt=tt;save();
}
function addItem(){S.items.push({ket:"Bata bolong",qty:"",harga:""});draw()}
function delItem(i){S.items.splice(i,1);if(!S.items.length)S.items.push({ket:"",qty:"",harga:""});draw()}
function addTal(){S.tal.push({ket:"",nom:""});draw()}
function delTal(i){S.tal.splice(i,1);draw()}
function reset(){if(!confirm("Hapus semua data dan mulai nota baru?"))return;
 S={nama:"",tgl:new Date().toISOString().slice(0,10),items:[{ket:"Bata bolong",qty:"",harga:""}],mobil:"",kuli:"",tal:[]};draw()}
function teks(){
 var L=["*NOTA BATA BOLONG*","Tanggal: "+S.tgl];if(S.nama)L.push("Pembeli: "+S.nama);L.push("","*Orderan*");
 S.items.forEach(function(it){L.push("- "+(it.ket||"Barang")+": "+n(it.qty).toLocaleString("id-ID")+" × "+rp(n(it.harga))+" = "+rp(n(it.qty)*n(it.harga)))});
 L.push("","Ongkos mobil: "+rp(n(S.mobil)),"Kuli bongkar: "+rp(n(S.kuli)),"*Total Bayar: "+rp(S._tb)+"*");
 if(S.tal.length){L.push("","*Talangan*");S.tal.forEach(function(t){L.push("- "+(t.ket||"Talangan")+": "+rp(n(t.nom)))});L.push("Total Talangan: "+rp(S._tt))}
 L.push("","*TOTAL YANG HARUS DIBAYAR: "+rp(S._tb-S._tt)+"*");return L.join("\n")}
function salin(){var t=teks(),b=$("bs");
 function ok(){b.textContent="Tersalin ✓";setTimeout(function(){b.textContent="Salin nota"},1500)}
 function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(a)}
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function lukis(c,nyata){
 var W=540,P=28,y=P+20;
 function f(sz,b){c.font=(b?'700 ':'400 ')+sz+'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'}
 function cut(t,m){while(c.measureText(t).width>m&&t.length>1)t=t.slice(0,-1);return t}
 function mid(t,sz,col,b){if(nyata){f(sz,b);c.fillStyle=col;c.textAlign='center';c.fillText(t,W/2,y)}y+=sz+8}
 function row(l,r,sz,b,col){if(nyata){f(sz,b);c.fillStyle=col||'#2b2118';c.textAlign='right';c.fillText(r,W-P,y);var rw=c.measureText(r).width;c.textAlign='left';c.fillText(cut(l,W-2*P-rw-12),P,y)}y+=sz+10}
 function line(){if(nyata){c.strokeStyle='#d9cdbf';c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();c.moveTo(P,y);c.lineTo(W-P,y);c.stroke();c.setLineDash([])}y+=18}
 function head(t){if(nyata){f(19,true);c.fillStyle='#b5481f';c.textAlign='left';c.fillText(t,P,y)}y+=30}
 mid('NOTA BATA BOLONG',24,'#b5481f',true);
 mid(S.tgl,14,'#7a6a5c');
 if(S.nama)mid('Pembeli: '+S.nama,15,'#2b2118',true);
 y+=2;line();
 head('ORDERAN');
 S.items.forEach(function(it){
  row(it.ket||'Barang','',16,true);y-=4;
  row('   '+n(it.qty).toLocaleString('id-ID')+' × '+rp(n(it.harga)),rp(n(it.qty)*n(it.harga)),15,false,'#5a4a3c');y+=2});
 line();
 row('Ongkos mobil',rp(n(S.mobil)),16);
 row('Kuli bongkar',rp(n(S.kuli)),16);
 y-=4;line();
 row('Total Bayar',rp(S._tb),18,true);
 if(S.tal.length){y+=4;line();head('TALANGAN');
  S.tal.forEach(function(t){row(t.ket||'Talangan',rp(n(t.nom)),16)});
  y-=4;line();row('Total Talangan',rp(S._tt),18,true)}
 y+=6;
 if(nyata){
  c.fillStyle='#b5481f';c.beginPath();var x=P,w=W-2*P,h=88,r=14;
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();
  c.textAlign='center';c.fillStyle='#ffe3d6';f(13,true);c.fillText('TOTAL YANG HARUS DIBAYAR',W/2,y+30);
  c.fillStyle='#fff';f(32,true);c.fillText(rp(S._tb-S._tt),W/2,y+68)}
 y+=88+26;
 mid('Terima kasih',13,'#7a6a5c');
 return y+P-10}
function gambar(){
 calc();
 var H=lukis(document.createElement('canvas').getContext('2d'),false);
 var cv=document.createElement('canvas');cv.width=1080;cv.height=Math.ceil(H*2);
 var c=cv.getContext('2d');c.scale(2,2);c.fillStyle='#ffffff';c.fillRect(0,0,540,H);
 lukis(c,true);return cv}
function pvBuka(note){
 var cv=gambar();$('pvimg').src=cv.toDataURL('image/jpeg',0.92);
 $('pvm').textContent=note||'Tekan lama gambar untuk menyimpan sebagai JPG.';
 $('pv').classList.add('on');$('pv').scrollTop=0}
function pvTutup(){$('pv').classList.remove('on')}
function kirimWA(){
 var cv=gambar();
 function fb(){pvBuka('Kirim langsung tidak tersedia di sini. Tekan lama gambar, simpan, lalu kirim lewat WhatsApp.')}
 cv.toBlob(function(b){
  if(!b){fb();return}
  var f=new File([b],'nota-bata-bolong-'+S.tgl+'.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   navigator.share({files:[f],title:'Nota Bata Bolong'}).catch(function(e){if(!e||e.name!=='AbortError')fb()})
  }else fb()},'image/jpeg',0.92)}
var W=32,BTC=null,BTD=null;
function st(m){$("st").textContent=m}
function ascii(s){return String(s).replace(/[×]/g,"x").replace(/[^\x20-\x7E]/g,"")}
function pd(l,r){var sp=W-l.length-r.length;return l+" ".repeat(sp<1?1:sp)+r}
function rpa(v){return "Rp "+Math.round(v).toLocaleString("id-ID")}
function struk(){
 var g="-".repeat(W),L=["NOTA BATA BOLONG".padStart(Math.floor((W+16)/2)),S.tgl];
 if(S.nama)L.push("Pembeli: "+S.nama);L.push(g);
 S.items.forEach(function(it){var s=n(it.qty)*n(it.harga);L.push(it.ket||"Barang");L.push(pd("  "+n(it.qty).toLocaleString("id-ID")+" x "+rpa(n(it.harga)),rpa(s)))});
 L.push(g,pd("Ongkos mobil",rpa(n(S.mobil))),pd("Kuli bongkar",rpa(n(S.kuli))),g,pd("TOTAL BAYAR",rpa(S._tb)));
 if(S.tal.length){L.push(g,"Talangan:");S.tal.forEach(function(t){L.push(pd("  "+(t.ket||"Talangan"),rpa(n(t.nom))))});L.push(pd("Total talangan",rpa(S._tt)))}
 L.push(g,"HARUS DIBAYAR",rpa(S._tb-S._tt).padStart(W),g,"Terima kasih".padStart(Math.floor((W+12)/2)),"","","");
 return ascii(L.join("\n"))}
function wrapT(s,w){s=ascii(s);var out=[],cur='';s.split(' ').forEach(function(wd){while(wd.length>w){if(cur){out.push(cur);cur=''}out.push(wd.slice(0,w));wd=wd.slice(w)}if(!cur)cur=wd;else if((cur+' '+wd).length<=w)cur+=' '+wd;else{out.push(cur);cur=wd}});if(cur)out.push(cur);return out.length?out:['']}
function bangun(){
 var T=[],g="-".repeat(W),e="=".repeat(W);
 function F(s){s=ascii(s);return (s+" ".repeat(W)).slice(0,W)}
 function add(s){T.push(F(s))}
 function mid(s){wrapT(s,W).forEach(function(x){add(" ".repeat(Math.floor((W-x.length)/2))+x)})}
 function row(l,r){l=ascii(l);r=ascii(r);
  if(l.length+r.length+1<=W){add(l+" ".repeat(W-l.length-r.length)+r)}
  else{wrapT(l,W).forEach(function(x){add(x)});add(" ".repeat(Math.max(0,W-r.length))+r)}}
 mid("NOTA BATA BOLONG");mid(S.tgl);if(S.nama)mid("Pembeli: "+S.nama);
 add(g);add("ORDERAN");add(g);
 S.items.forEach(function(it){
  wrapT(it.ket||"Barang",W).forEach(function(x){add(x)});
  row("  "+n(it.qty).toLocaleString("id-ID")+" x "+rpa(n(it.harga)),rpa(n(it.qty)*n(it.harga)))});
 add(g);row("Ongkos mobil",rpa(n(S.mobil)));row("Kuli bongkar",rpa(n(S.kuli)));
 add(g);row("TOTAL BAYAR",rpa(S._tb));
 if(S.tal.length){add(g);add("TALANGAN");add(g);
  S.tal.forEach(function(t){row(t.ket||"Talangan",rpa(n(t.nom)))});
  add(g);row("TOTAL TALANGAN",rpa(S._tt))}
 add(e);mid("HARUS DIBAYAR");mid(rpa(S._tb-S._tt));add(e);
 mid("Terima kasih");
 for(var k=0;k<5;k++)add("");
 var o=[0x1b,0x40],s=T.join("");
 for(var i=0;i<s.length;i++)o.push(s.charCodeAt(i));
 return o}
function bangunLama(){
 var o=[],g='-'.repeat(W);
 function raw(){for(var i=0;i<arguments.length;i++)o.push(arguments[i])}
 function ln(s){s=ascii(s);for(var i=0;i<s.length;i++)o.push(s.charCodeAt(i));o.push(10)}
 function al(a){raw(0x1b,0x61,a)}
 function bd(v){raw(0x1b,0x45,v?1:0)}
 function sz(v){raw(0x1d,0x21,v)}
 function row(l,r){l=ascii(l);r=ascii(r);if(l.length+r.length+1>W)l=l.slice(0,W-r.length-1);ln(l+' '.repeat(W-l.length-r.length)+r)}
 raw(0x1b,0x40);
 al(1);bd(1);sz(0x01);ln('NOTA BATA BOLONG');sz(0);bd(0);
 ln(S.tgl);
 if(S.nama){bd(1);wrapT('Pembeli: '+S.nama,W).forEach(ln);bd(0)}
 al(0);ln(g);
 bd(1);ln('ORDERAN');bd(0);
 S.items.forEach(function(it){
  bd(1);wrapT(it.ket||'Barang',W).forEach(ln);bd(0);
  var l='  '+n(it.qty).toLocaleString('id-ID')+' x '+rpa(n(it.harga)),r=rpa(n(it.qty)*n(it.harga));
  if(l.length+r.length+1>W){ln(l);ln(' '.repeat(Math.max(0,W-r.length))+r)}else row(l,r)});
 ln(g);
 row('Ongkos mobil',rpa(n(S.mobil)));
 row('Kuli bongkar',rpa(n(S.kuli)));
 ln(g);
 bd(1);row('TOTAL BAYAR',rpa(S._tb));bd(0);
 if(S.tal.length){
  ln(g);bd(1);ln('TALANGAN');bd(0);
  S.tal.forEach(function(t){var k=wrapT(t.ket||'Talangan',W-14);
   row(k[0],'- '+rpa(n(t.nom)));for(var i=1;i<k.length;i++)ln(k[i])});
  bd(1);row('Total talangan','- '+rpa(S._tt));bd(0)}
 ln(g);
 al(1);bd(1);ln('HARUS DIBAYAR');
 var a=rpa(S._tb-S._tt);sz(a.length<=16?0x11:0x01);ln(a);sz(0);bd(0);
 al(0);ln(g);
 al(1);ln('Terima kasih');al(0);
 raw(0x1b,0x64,4);
 return o}
async function cetakBT(){
 if(!navigator.bluetooth){st("Browser ini tidak mendukung Bluetooth. Pakai Chrome di Android atau komputer, bukan iPhone.");return}
 var b=$("bb");b.disabled=true;
 try{
  if(!BTC||!BTD||!BTD.gatt.connected){
   st("Pilih printer Bluetooth...");
   BTD=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:["000018f0-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455","0000fee7-0000-1000-8000-00805f9b34fb","0000ae30-0000-1000-8000-00805f9b34fb","0000ffe5-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb","00001101-0000-1000-8000-00805f9b34fb","0000af30-0000-1000-8000-00805f9b34fb"]});
   st("Menyambung ke "+(BTD.name||"printer")+"...");
   var sv=await BTD.gatt.connect().then(function(s){return s.getPrimaryServices()});
   BTC=null;
   for(var i=0;i<sv.length&&!BTC;i++){var cs=await sv[i].getCharacteristics();
    for(var j=0;j<cs.length;j++){if(cs[j].properties.write||cs[j].properties.writeWithoutResponse){BTC=cs[j];break}}}
   if(!BTC)throw new Error("Printer tidak punya jalur tulis yang dikenali");
  }
  st("Mencetak...");
  var d=new Uint8Array(bangun());
  for(var p=0;p<d.length;p+=20){var ch=d.slice(p,p+20);
   if(BTC.properties.writeWithoutResponse)await BTC.writeValueWithoutResponse(ch);else await BTC.writeValue(ch);
   await new Promise(function(r){setTimeout(r,20)})}
  st("Selesai dicetak ✓");
 }catch(e){BTC=null;st("Gagal: "+(e&&e.message?e.message:e))}
